# บริการสำหรับ dev: PostgreSQL + Garage (S3)
# ชื่อ project และ volume ต้องไม่ซ้ำกับระบบอื่นบนเครื่องเดียวกัน
name: msu-club

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: app_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - msu_club_pgdata:/var/lib/postgresql
      # สคริปต์นี้รันครั้งเดียวตอน volume ยังว่าง (สร้างฐาน app_test)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d app_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    # --single-node: กำหนด layout ของ cluster ให้อัตโนมัติสำหรับเครื่องเดียว
    command: ["/garage", "server", "--single-node"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?ต้องกำหนด GARAGE_RPC_SECRET ใน .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?ต้องกำหนด GARAGE_ADMIN_TOKEN ใน .env}
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"
      - "${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - msu_club_garage_meta:/var/lib/garage/meta
      - msu_club_garage_data:/var/lib/garage/data

volumes:
  msu_club_pgdata:
  msu_club_garage_meta:
  msu_club_garage_data:
