# nginx บน host: /etc/nginx/sites-available/msu-club.conf → ln -s ไป sites-enabled แล้ว nginx -t && systemctl reload nginx
# โดเมนเดียว club.msu.ac.th (ใบรับรอง wildcard *.msu.ac.th ของมหาวิทยาลัย)
#   /             → web  (Next.js)
#   /api/         → api  (Express) ตัด prefix /api ออกก่อนส่ง
#   /club-files/  → Garage (presigned URL) ส่ง path และ Host เดิมทุกตัวอักษร ไม่เช่นนั้นลายเซ็นไม่ตรง

upstream msu_club_web   { server 127.0.0.1:3000; keepalive 16; }
upstream msu_club_api   { server 127.0.0.1:4000; keepalive 16; }
upstream msu_club_files { server 127.0.0.1:3900; keepalive 8; }

server {
    listen 80;
    listen [::]:80;
    server_name club.msu.ac.th;
    return 301 https://$host$request_uri;
}

server {
    # รูปแบบเดิมของ http2 ใช้ได้กับ nginx 1.24 (Ubuntu 24.04); nginx ≥ 1.25.1 จะเตือนว่าเลิกใช้แต่ยังทำงาน
    # ถ้า nginx ≥ 1.25.1 เปลี่ยนเป็น: listen 443 ssl; + บรรทัด http2 on;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name club.msu.ac.th;

    # ใบรับรองของมหาวิทยาลัย (แก้ path ให้ตรงกับที่วางไฟล์จริง; crt ต้องรวม intermediate chain)
    ssl_certificate     /etc/ssl/msu/wildcard.msu.ac.th.fullchain.crt;
    ssl_certificate_key /etc/ssl/msu/wildcard.msu.ac.th.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:msu_club_ssl:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # JSON ของ API จำกัด 100 KB อยู่แล้ว ไฟล์ไม่ผ่าน API (ไปที่ /club-files/ ตรง)
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # API ตั้ง TRUST_PROXY=1: เชื่อเฉพาะ IP ที่ nginx ต่อท้ายไว้ขวาสุด
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    location /api/ {
        # มี "/" ท้าย proxy_pass = ตัด /api ออก: /api/auth/me → /auth/me
        proxy_pass http://msu_club_api/;
    }

    location ^~ /club-files/ {
        # ไม่มี URI ท้าย proxy_pass = ส่ง path เดิมไม่แตะ (presigned URL เซ็นทั้ง path และ Host)
        proxy_pass http://msu_club_files;
        # Host ตามที่ browser ส่งมาทุกตัวอักษร (รวม port ถ้ามี) — เป็นส่วนหนึ่งของลายเซ็น
        proxy_set_header Host $http_host;
        client_max_body_size 12m;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://msu_club_web;
    }
}
